# Automatically spawn 1 worker process per available CPU core
worker_processes auto;

# Bind worker processes to specific CPU cores for better cache performance
worker_cpu_affinity auto;

events {
    # Allows Nginx to handle more concurrent connections per worker
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/stderr error;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 1. Define the upstream backend group
    upstream rate_limiter_servers {
        # Docker DNS automatically resolves 'server' to all 3 scaled instances
        server server:8080 max_fails=3 fail_timeout=10s;

        # Maintain a pool of idle connections to backends (CRITICAL for high RPS)
        keepalive 512;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://rate_limiter_servers;

            # 2. Re-enable HTTP Keep-Alive to your Go backends
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}